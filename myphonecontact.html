<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My phone contact</title>
    <style>
        body{
    
            background-color: antiquewhite;
            padding:40px;
            text-align: center;
            
        }
        .card{
            border-radius: 12px;
            border:5px double crimson ;
            box-shadow:0px 10px 20px coral;
            margin: 5px;
            padding:4px;
            width: 250px;
        }

        h2{
            text-decoration: underline;
            
        }

        p{
            background-color: rgb(192, 125, 43);
            text-align: left;
            padding:10px;
            border-radius: 500px;
        }


        span{
            font-weight: bold;
            color: antiquewhite;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>My contact</h2>
        <p>Name : <span id="name"></span></p>
        <p>Phone Number : <span id="phonenumber"></span></p>
        <p>School : <span id="school"></span></p>
        <p>City : <span id="city"></span></p>
    </div>
    <script>
        var Mycontact= {
            name : "Daniel Li" ,
            phonenumber : "04768490385" ,
            school : "Xavier College" ,
            city : "Melbourne" ,

            

        };
        document.getElementById("name").textContent= Mycontact.name ;
        document.getElementById("phonenumber").textContent= Mycontact.phonenumber;
        document.getElementById("school").textContent= Mycontact["school"];
        document.getElementById("city").textContent= Mycontact["city"];

    </script>
</body>
</html>
