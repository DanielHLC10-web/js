<!DOCTYPE html>
<html>
<head>
  <title>My Birthday Countdown Checker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      color: #3b2f2f;
      text-align: center;
    }

    .birthday-card {
      width: 520px;
      background-color: white;
      border: 4px solid #ff6f91;
      border-radius: 20px;
      margin: 40px auto;
      padding: 25px;
      box-shadow: 0 0 20px #ff8fab;
    }

    h1 {
      color: #ff477e;
      font-size: 34px;
    }

    .emoji {
      font-size: 60px;
    }

    .info-box {
      background-color: #fff0f5;
      border: 2px dashed #ff6f91;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }

    button {
      background-color: #ff477e;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #d6336c;
    }

    #daysBox {
      font-size: 42px;
      font-weight: bold;
      color: #7209b7;
    }

    #result {
      font-size: 17px;
      line-height: 1.6;
    }

    #countdown {
      color: #ff477e;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="birthday-card">

    <div class="emoji">🎂🎉</div>

    <h1>My Birthday Countdown Checker</h1>

    <p>
      Click the button to check how many days are left for the birthday celebration.
    </p>

    <button onclick="checkBirthday()">
      Check Birthday Countdown
    </button>

    <h2>Days Left</h2>

    <div id="daysBox">?</div>

    <div class="info-box">
      <h2>Birthday Result</h2>
      <p id="result"></p>
    </div>

    <div class="info-box">
      <h2>Countdown Review</h2>
      <p id="countdown"></p>
    </div>

  </div>

  <script>
    function checkBirthday() {

      // Birthday information
      let birthdayPresent = "Birthday Cake";
      let birthdayPlan = "Celebrate with family and friends";

      const studentName = "Daniel";
      const birthdayMonth = 10;
      const birthdayDate = 31;

      let message = "";

      // Get today's date
      let today = new Date();

      // Get the current year
      let currentYear = today.getFullYear();

      // Create birthday date for this year
      let birthday = new Date(
        currentYear,
        birthdayMonth - 1,
        birthdayDate
      );

      // If birthday has already passed,
      // use next year's birthday
      if (birthday < today) {
        birthday = new Date(
          currentYear + 1,
          birthdayMonth - 1,
          birthdayDate
        );
      }

      // Calculate difference between birthday and today
      let timeDifference = birthday - today;

      // Convert milliseconds into days
      let daysLeft = Math.ceil(
        timeDifference / (1000 * 60 * 60 * 24)
      );

      // Create birthday message
      if (daysLeft === 0) {

        message =
          "Happy Birthday, " +
          studentName +
          "! Today is your special day!";

      } else if (daysLeft <= 7) {

        message =
          "Your birthday is almost here, " +
          studentName +
          "!";

      } else {

        message =
          "Keep counting, " +
          studentName +
          "! Your birthday is coming soon.";

      }

      // Create birthday result
      let bdaymessage =
        "Student Name: " +
        studentName +
        "<br>";

      bdaymessage +=
        "Today's Date: " +
        today.toDateString() +
        "<br>";

      bdaymessage +=
        "Birthday Date: " +
        birthday.toDateString() +
        "<br>";

      bdaymessage +=
        "Message: " +
        message +
        "<br><br>";

      bdaymessage +=
        "Birthday Gift: " +
        birthdayPresent +
        "<br>";

      bdaymessage +=
        "Birthday Plan: " +
        birthdayPlan;

      // Display birthday result
      document.getElementById("daysBox").innerHTML =
        daysLeft;

      document.getElementById("result").innerHTML =
        bdaymessage;

      // Display countdown review
      document.getElementById("countdown").innerHTML =
        "There are " +
        daysLeft +
        " days remaining until " +
        studentName +
        "'s birthday!";
    }
  </script>
