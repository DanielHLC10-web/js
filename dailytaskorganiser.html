<!DOCTYPE html>
<html>
<head>
  <title>My Daily Task Organizer</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background: lavender; }
    h1, h3 { color: darkviolet; }
    .box { background: white; color: darkviolet; }
  </style>
</head>

<body>
<div class="container py-4">

  <h1 class="mb-1">My basketball rountine</h1>
  <p class="text-muted mb-4">Sort and label your basketball rountine!</p>

  
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Basketball drills</h3>

      <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
      <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>

      <div id="taskResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Makes Needed</h3>

      <button class="btn btn-primary mr-2" onclick="sortShortest()">Shortest First</button>
      <button class="btn btn-primary" onclick="sortLongest()">Longest First</button>

      <div id="makesResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Label Every Task Time</h3>

      <button class="btn btn-primary" onclick="addLabel()">Add Makes Label</button>

      <div id="labelResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

</div>

<script>
  var tasks = ["Miken drill", "2 motion jumper", "Midrange jumper", "3 pointer", "Free Throw"];
  var makes = [300, 150, 200, 250, 100];

  document.getElementById("taskResult").innerHTML =
    "Tasks: " + tasks;

  document.getElementById("makesResult").innerHTML =
    "Makes needed: " + makes;

  document.getElementById("labelResult").innerHTML =
    "Press the button above!";

  function sortAZ() {
    tasks.sort();
    document.getElementById("taskResult").innerHTML = "A to Z: " + tasks;
  }

  function sortZA() {
    tasks.sort();
    tasks.reverse();
    document.getElementById("taskResult").innerHTML = "Z to A: " + tasks;
  }

  function sortShortest() {
    makes.sort(function(a, b) { return a - b; });
    document.getElementById("makesResult").innerHTML = "Least makes first: " + makes;
  }

  function sortLongest() {
    makes.sort(function(a, b) { return b - a; });
    document.getElementById("makesResult").innerHTML = "Most makes first: " + makes;
  }

  function addLabel() {
    var labelledMakes = makes.map(function(makes) { return makes + " makes"; });
    document.getElementById("labelResult").innerHTML = "Labelled makes: " + labelledMakes.join(",");
  }
</script>

</body>
</html>
